trigger:
 branches:
   include:
     - main

pool: infra-pool

stages:
  - stage: 
    displayName: terraformRG
    jobs:
      - job: 
        displayName: terraform init plan apply
        steps:
          - task: tfsec@1
            inputs:
              version: 'v1.26.0'
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'infra-serviceconnection'
              backendAzureRmResourceGroupName: 'rg-david-prod'
              backendAzureRmStorageAccountName: 'davidstg91'
              backendAzureRmContainerName: 'prodcontainer'
              backendAzureRmKey: 'terraform.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'infra-serviceconnection'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'infra-serviceconnection'
